name: SR-1A probe
on:
  workflow_dispatch:
    inputs:
      year:
        default: "2025"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - run: python tools/sr1a_probe.py ${{ inputs.year }}
