name: Clerk site survey
on:
  workflow_dispatch:
    inputs:
      counties: {default: ""}
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium > /dev/null
      - run: python tools/clerk_survey.py ${{ inputs.counties }}
