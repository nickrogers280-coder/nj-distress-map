name: Clerk site survey
on:
  workflow_dispatch:
    inputs:
      counties: {default: ""}
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          pip install -q -r requirements.txt playwright
          python -m playwright install --with-deps chromium > /dev/null
      - run: python tools/clerk_survey.py ${{ inputs.counties }}
        if: ${{ inputs.counties != 'step2' && inputs.counties != 'step3' && inputs.counties != 'step4' && inputs.counties != 'step5' }}
      - run: python tools/clerk_survey2.py
        if: ${{ inputs.counties == 'step2' }}
      - run: python tools/clerk_probe3.py
        if: ${{ inputs.counties == 'step3' }}
      - run: python tools/clerk_probe4.py
        if: ${{ inputs.counties == 'step4' }}
      - run: python tools/clerk_probe5.py
        if: ${{ inputs.counties == 'step5' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: survey, path: survey/, if-no-files-found: ignore}
