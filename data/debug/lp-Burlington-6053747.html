    <script>

        function changeButton(btncssclass) {
            try {
                var el = event.srcElement;
                if (el.tagName.toUpperCase() == "INPUT")
                    if (el.type.toUpperCase() == "SUBMIT" || el.type.toUpperCase() == "BUTTON" || el.type.toUpperCase() == "RESET") {
                    //alert(event.srcElement.className);
                    if (event.srcElement.className.indexOf("Small") > 0) btncssclass += "Small"
                    event.srcElement.className = btncssclass;
                }
            }
            catch (ex) { }
        }

    </script>
    <script type="text/javascript" language="javascript">

        function hideLeftFrameLoadingMsg() {
            if (parent.InstViewerHeadFrame.document.getElementById) {  // DOM3 = IE5, NS6
                parent.InstViewerHeadFrame.document.getElementById('loadMsg').style.visibility = 'hidden';
            }
            else {
                if (parent.InstViewerHeadFrame.document.layers) {  // Netscape 4
                    document.loadMsg.visibility = 'hidden';
                }
                else {  // IE 4
                    parent.InstViewerHeadFrame.document.all.loadMsg.style.visibility = 'hidden';
                }
            }
            // Resetting the mouse pointer to default.
            parent.InstViewerHeadFrame.document.body.style.cursor = "default";
            parent.InstViewerBodyFrame.document.body.style.cursor = "default";
        }

        function showLeftFrameLoadingMsg() {
            if (document.getElementById) {  // DOM3 = IE5, NS6
                document.getElementById('loadMsg').style.visibility = '';
            }
            else {
                if (document.layers) {  // Netscape 4
                    document.loadMsg.visibility = '';
                }
                else {  // IE 4
                    document.all.loadMsg.style.visibility = '';
                }
            }
        }

    </script>
