/* Layout: full-height map console. Sidebar (alerts + properties) left, satellite map fills the rest,
   property file slides in over the map's right edge. Dark by design so pins read over imagery. */
:root {
  --ground: #121a23;
  --panel: #18222d;
  --panel-2: #1f2b38;
  --line: #2b3a4a;
  --ink: #e7edf3;
  --ink-2: #a3b1bf;
  --ink-3: #74859a;
  --pin: #47c7ec;          /* tracked commercial */
  --pin-possible: #f0a63a; /* amber accent */
  --pin-land: #9bd86b;     /* vacant land */
  --pin-closed: #8794a3;
  --pin-reo: #c58cff;      /* bank-owned (REO) */
  --pin-pre: #ffb347;      /* pre-foreclosure (lis pendens) */
  --alert: #ff5c72;
  --parcel: #ffe066;       /* tax-map yellow, for parcel outlines */
  --ok: #5fd39a;
  --font-head: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--pin); }
:focus-visible { outline: 2px solid var(--pin); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto 1fr; }
.topbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-family: var(--font-head); font-weight: 700; font-size: 19px; letter-spacing: .01em; }
.brand .sub { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.stats { display: flex; gap: 18px; margin-left: auto; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; }
.stat b { font-family: var(--font-data); font-weight: 500; font-size: 16px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .06em; }
.stat.hot b { color: var(--alert); }
.layer-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.layer-toggle button { background: none; border: 0; padding: 6px 10px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.layer-toggle button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); }
.panel-btn { display: none; }

.body { position: relative; display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
.side { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-right: 1px solid var(--line); }
.filters { display: grid; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.search { width: 100%; box-sizing: border-box; background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.search::placeholder { color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--line); background: none; font-size: 12px; color: var(--ink-2); cursor: pointer; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--pin)); }
.chip[aria-pressed="true"] { color: var(--ink); background: var(--panel-2); border-color: color-mix(in srgb, var(--c, var(--pin)) 55%, var(--line)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row select { flex: 1 1 120px; min-width: 0; background: var(--ground); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12px; }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--ink-2); white-space: nowrap; }

.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 0; font-family: var(--font-head); font-weight: 600; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); cursor: pointer; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--pin); }
.stages { list-style: none; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; counter-reset: st; }
.stages li { position: relative; padding: 8px 6px 6px; border-top: 3px solid var(--line); font-size: 11px; color: var(--ink-3); min-width: 0; }
.stages li b { display: block; font: 600 11px var(--font-head); letter-spacing: .04em; text-transform: uppercase; }
.stages li span { display: block; margin-top: 2px; overflow-wrap: anywhere; }
.stages li.done { border-top-color: var(--pin); color: var(--ink-2); }
.stages li.now { border-top-color: var(--alert); color: var(--ink); }
.records { list-style: none; margin: 0; padding: 0; }
.records li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.records .rk { font-weight: 600; color: var(--ink); border-left: 3px solid var(--t); padding-left: 7px; }
.records time { font-family: var(--font-data); font-size: 11.5px; color: var(--ink-2); }
.records .rp, .records .note { grid-column: 1 / -1; padding-left: 10px; }
.records .arrow { color: var(--ink-3); }
.records .gitem { all: unset; box-sizing: border-box; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; width: 100%; cursor: pointer; }
.records .gitem[aria-current="true"] .rk { text-decoration: underline; text-underline-offset: 3px; }
.records .gitem:focus-visible { outline: 2px solid var(--pin); outline-offset: 2px; }
.pcheck { margin: 0 0 10px; font-size: 12px; padding: 6px 9px; border-radius: 6px; border: 1px solid var(--line); color: var(--ink-2); }
.pcheck.ok { border-color: color-mix(in srgb, var(--pin-land) 45%, var(--line)); }
.pcheck.bad { border-color: var(--alert); color: var(--ink); }
.pin .multi { position: absolute; top: -9px; right: -11px; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px; background: var(--ink); color: var(--ground); font: 700 10px/15px var(--font-data); text-align: center; }
.subh { margin: 14px 0 4px; font: 600 11px var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.subh .count, .sec h3 .count { font-family: var(--font-data); font-weight: 400; color: var(--ink-3); margin-left: 4px; }
.list .day { position: sticky; top: 0; z-index: 1; padding: 6px 14px; background: var(--panel); border-bottom: 1px solid var(--line); font: 600 11px var(--font-head); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
.tabs .count { font-family: var(--font-data); font-weight: 400; margin-left: 4px; color: var(--ink-3); }
.list { flex: 1; overflow-y: auto; min-height: 0; }
.item { display: grid; gap: 3px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 11px 14px; cursor: pointer; }
.item:hover, .item[aria-current="true"] { background: var(--panel-2); }
.item .top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.item .addr { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.item .meta { font-size: 12px; color: var(--ink-2); }
.item .change { font-size: 12px; color: var(--ink); }
.item .when { margin-left: auto; font-size: 11px; color: var(--ink-3); white-space: nowrap; font-family: var(--font-data); }
.unseen { width: 7px; height: 7px; border-radius: 50%; background: var(--alert); flex: none; }
.tag { display: inline-block; padding: 1px 6px; border-radius: 3px; font-family: var(--font-head); font-weight: 600; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; background: color-mix(in srgb, var(--t, var(--alert)) 22%, transparent); color: var(--t, var(--alert)); white-space: nowrap; }
.empty { padding: 28px 18px; color: var(--ink-3); font-size: 13px; line-height: 1.5; }
.foot { padding: 10px 14px; border-top: 1px solid var(--line); font-size: 11px; color: var(--ink-3); line-height: 1.5; }
.foot .err { color: var(--alert); }

#map { min-height: 0; height: 100%; background: #0b1016; }
.leaflet-container { font-family: var(--font-body); }
.leaflet-control-attribution { background: rgba(18,26,35,.75) !important; color: var(--ink-3) !important; font-size: 10px; }
.leaflet-control-attribution a { color: var(--ink-2) !important; }
.leaflet-bar a { background: var(--panel) !important; color: var(--ink) !important; border-color: var(--line) !important; }

/* pins */
.pin { position: relative; display: block; width: 16px; height: 16px; }
.pin i { position: absolute; inset: 0; border-radius: 50%; background: var(--c); border: 2px solid #0b1016; box-shadow: 0 0 0 1.5px var(--c), 0 2px 6px rgba(0,0,0,.6); }
.pin.target { --c: var(--pin); }
.pin.possible { --c: var(--pin-possible); }
.pin.land { --c: var(--pin-land); }
.lot-label { background: rgba(18,26,35,.85); border: 1px solid var(--parcel); color: var(--parcel); font-family: var(--font-head); font-size: 11px; font-weight: 600; padding: 1px 5px; box-shadow: none; }
.lot-label::before { display: none; }
.pre-box { margin: 0 0 12px; padding: 9px 11px; border-left: 3px solid var(--pin-pre); background: color-mix(in srgb, var(--pin-pre) 12%, transparent); font-size: 13px; }
.pre-box b { display: block; margin-bottom: 2px; }
.enrich-btn { display: block; width: 100%; margin: 6px 0 4px; padding: 9px 12px; border: 1px solid var(--pin); border-radius: 6px; background: color-mix(in srgb, var(--pin) 14%, transparent); color: var(--ink); font: 600 13px var(--font-head); letter-spacing: .04em; text-transform: uppercase; cursor: pointer; }
.enrich-btn:hover { background: color-mix(in srgb, var(--pin) 26%, transparent); }

.pin.closed { --c: var(--pin-closed); }

.pin.pre i { background: rgba(255,179,71,.18); border: 3px solid var(--pin-pre); box-shadow: 0 0 0 1.5px #0b1016, 0 2px 6px rgba(0,0,0,.6); }
.pin.reo i { border-radius: 2px; transform: rotate(45deg) scale(.92); }

.pin.reo .flag { background: var(--pin-reo); color: #1b1026; }

.pin.reo.alert::before { border-color: var(--pin-reo); border-radius: 4px; transform-origin: center; }
.chip.status i { border-radius: 2px; }
.chip.status[data-status="open"] i { border-radius: 50%; }
.chip.status[data-status="reo"] i { transform: rotate(45deg) scale(.85); }
.reo-box { display: grid; gap: 4px; padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--pin-reo) 12%, var(--panel)); border: 1px solid color-mix(in srgb, var(--pin-reo) 40%, var(--line)); font-size: 13px; }
.reo-box b { color: var(--pin-reo); font-family: var(--font-head); letter-spacing: .04em; text-transform: uppercase; font-size: 12px; }
.pin.alert::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 2px solid var(--alert); animation: pulse 1.8s ease-out infinite; }

.pin .flag { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 2px 7px; border-radius: 3px; background: var(--alert); color: #fff; font-family: var(--font-head); font-weight: 700; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.5); }

.pin.selected i { transform: scale(1.35); }

.detail { position: absolute; top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); bottom: 12px; width: 380px; max-width: calc(100% - 24px); z-index: 900;

details summary { cursor: pointer; color: var(--ink-2); font-size: 12px; }

0+00:00","kind":"status","old_value":"Scheduled (2026-12-10)","new_value":"Adjourned - Plaintiff (2027-01-07)"},{"id":12,"property_id":"9000000103","ts":"2026-11-14T11:47:00+00:00","kind":"sale_date","old_value":"2026-12-10","new_value":"2027-01-07"},{"id":11,"property_id":"9000000103","ts":"2026-11-14T11:47:00+00:00","kind":"upset","old_value":"4100000","new_value":"4250000"},{"id":10,"property_id":"9000000106","ts":"2026-11-14T11:47:00+00:00","kind":"status","old_value":"Scheduled (2026-11-06)","new_value":"Bankruptcy Hold (2026-11-13)"},{"id":9,"property_id":"9000000114","ts":"2026-11-14T11:47:00+00:00","kind":"closed","old_value":"Adjourned - Plaintiff","new_value":"Cancelled"},{"id":8,"property_id":"9000000107","ts":"2026-11-13T11:45:00+00:00","kind":"new","old_value":null,"new_value":null},{"id":7,"property_id":"9000000112","ts":"2026-11-13T11:45:00+00:00","kind":"new","old_value":null,"new_value":null},{"id":6,"property_id":"9000000101","ts":"2026-11-11T11:45:00+00:00","kind":"status","old_value":"Scheduled (2026-11-12)","new_value":"Adjourned - Defendant (2026-12-17)"},{"id":5,"property_id":"9000000110","ts":"2026-11-11T11:45:00+00:00","kind":"status","old_value":"Scheduled (2026-11-10)","new_value":"Adjourned - Plaintiff (2026-12-08)"},{"id":4,"property_id":"9000000104","ts":"2026-11-08T11:45:00+00:00","kind":"status","old_value":"Adjourned - Sheriff (2026-11-05)","new_value":"Adjourned - Plaintiff (2026-12-03)"}]}</script>
<script>
(() => {
  const PARCELS = "https://services2.arcgis.com/XVOqAjTOJ5P6ngMu/ArcGIS/rest/services/Parcels_Composite_NJ_WM/FeatureServer/0/query";
  const TYPES = [
    { key: "4A", label: "Commercial", c: "var(--pin)" },
    { key: "4B", label: "Industrial", c: "var(--pin)" },
    { key: "4C", label: "Apartments", c: "var(--pin)" },
    { key: "1", label: "Vacant land", c: "var(--pin-land)" },
  ];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const money = (v) => (v == null || v === "" ? "—" : "$" + Math.round(+v).toLocaleString("en-US"));
  const short$ = (v) => {
    if (v == null) return "—";
    v = +v;
    return v >= 1e6 ? "$" + (v / 1e6).toFixed(v >= 1e7 ? 1 : 2) + "M" : v >= 1e3 ? "$" + Math.round(v / 1e3) + "K" : "$" + v;
  };
  const parseDay = (s) => (s ? new Date(String(s).slice(0, 10) + "T12:00:00") : null);
  const fmtDate = (s) => { const d = parseDay(s); return d && !isNaN(d) ? d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "—"; };
  const isoToNice = (t) => String(t ?? "").replace(/\d{4}-\d{2}-\d{2}/g, (m) => fmtDate(m));
  const titleCase = (s) => String(s || "").toLowerCase().replace(/\b([a-z])/g, (m) => m.toUpperCase()).replace(/\b(Llc|Lp|Llp|Pllc|Pc|Inc|Na|Nj|Us|Usa|Fsb|Cmbs|Reit)\b/g, (m) => m.toUpperCase());

  let DATA, NOW, LAST_VISIT, map, layers, markers = new Map(), selected = null, outline = null, tab = "alerts";
  const STATUSES = [
    { key: "pre", label: "Pre-foreclosure", c: "var(--pin-pre)" },
    { key: "open", label: "Upcoming sales", c: "var(--pin)" },
    { key: "reo", label: "Bank-owned (REO)", c: "var(--pin-reo)" },
    { key: "off", label: "Other off-list", c: "var(--pin-closed)" },
  ];
  const state = { q: "", county: "", window: "", statuses: new Set(["pre", "open", "reo"]), types: new Set(TYPES.map((t) => t.key)) };
  const isPre = (p) => p.stage === "pre";
  const statusKey = (p) => (isPre(p) ? (p.lp_status === "pending" ? "pre" : "off") : p.is_open ? "open" : p.outcome === "reo" ? "reo" : "off");
  const isReo = (p) => !p.is_open && p.outcome === "reo";

  function alertLabel(a) {
    const v = (a.new_value || "").toLowerCase();
    if (a.kind === "new") return "New listing";
    if (a.kind === "lis_pendens") return "New lis pendens";
    if (a.kind === "lp_closed") return "Lis pendens closed out";
    if (a.kind === "sale_date") return "New sale date";
    if (a.kind === "upset") return "Upset changed";
    if (a.kind === "judgment") return "Judgment changed";
    if (a.kind === "reo") return "Bank-owned (REO)";
    if (a.kind === "closed" && /plaintiff|buy\s*-?\s*back/.test(v) && !/3rd|third/.test(v)) return "Bought back by lender";
    if (a.kind === "closed") return /sold|purchas/.test(v) ? "Sold" : /cancel/.test(v) ? "Cancelled" : /withdr|vacat|dismiss/.test(v) ? "Withdrawn" : "Off the list";
    if (/bankrupt/.test(v)) return "Bankruptcy hold";
    if (/adjourn/.test(v)) return "Adjourned";
    if (/sold|purchas/.test(v)) return "Sold";
    if (/cancel/.test(v)) return "Cancelled";
    return "Status change";
  }
  function alertText(a) {
    const nice = (x) => (a.kind === "upset" || a.kind === "judgment" ? money(x) : a.kind === "sale_date" ? fmtDate(x) : isoToNice(x));
    if (a.kind === "new") return "Added to the sheriff sale list";
    if (a.kind === "lis_pendens") return "Foreclosure filed by " + titleCase(a.new_value || "the lender");
    if (a.kind === "closed") return "Final status: " + isoToNice(a.new_value);
    if (a.kind === "reo") return "Lender bought it back at sheriff sale" + (a.new_value ? " (" + a.new_value + ")" : "");
    return (a.old_value ? nice(a.old_value) + " → " : "") + nice(a.new_value);
  }
  const ago = (ts) => {
    const days = Math.floor((NOW - new Date(ts)) / 864e5);
    return days <= 0 ? "Today" : days === 1 ? "Yesterday" : days + "d ago";
  };
  const typeKey = (p) => (p.category === "land" ? "1" : p.prop_class || "");
  const firstDefendant = (d) => String(d || "").split(/;|\bET\.?\s*ALS?\b|\bA\/K\/A\b/i)[0].trim();

  function visible(p) {
    if (!state.statuses.has(statusKey(p))) return false;
    if (!state.types.has(typeKey(p))) return false;
    if (state.county && p.county !== state.county) return false;
    if (state.window) {
      const d = parseDay(p.sale_date);
      if (!d || d < NOW - 864e5 || d > +NOW + state.window * 864e5) return false;
    }
    if (state.q) {
      const hay = [p.street, p.city, p.muni, p.county, p.defendant, p.plaintiff, p.court_case, p.sheriff_number, p.block && "block " + p.block, isReo(p) ? "reo bank-owned bank owned" : "", isPre(p) ? "lis pendens pre-foreclosure preforeclosure " + (p.instrument || "") : ""].join(" ").toLowerCase();
      if (!state.q.split(/\s+/).every((w) => hay.includes(w))) return false;
    }
    return true;
  }

  function recentAlerts() {
    const cutoff = +NOW - 7 * 864e5;
    return DATA.alerts.filter((a) => +new Date(a.ts) >= cutoff);
  }

  // ---------------------------------------------------------------- map
  function initMap() {
    map = L.map("map", { zoomControl: true, preferCanvas: false, maxZoom: 20 }).setView([40.25, -74.55], 8);
    const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
      maxNativeZoom: 19, maxZoom: 20, attribution: "Imagery © Esri, Maxar, Earthstar Geographics",
    });
    const roads = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 20, opacity: 0.85 });
    const labels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}", { maxNativeZoom: 19, maxZoom: 20 });
    const street = L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd", maxZoom: 20, attribution: "© OpenStreetMap contributors © CARTO",
    });
    layers = { satellite: L.layerGroup([sat, roads, labels]), streets: street };
    layers.satellite.addTo(map);
    const flags = () => document.getElementById("map").classList.toggle("show-flags", map.getZoom() >= 11);
    map.on("zoomend", flags); flags();
    const setLayer = (name) => {
      Object.entries(layers).forEach(([k, l]) => (k === name ? l.addTo(map) : map.removeLayer(l)));
      $("#lyr-sat").setAttribute("aria-pressed", name === "satellite");
      $("#lyr-street").setAttribute("aria-pressed", name === "streets");
      store.set("njdm:layer", name);
    };
    $("#lyr-sat").onclick = () => setLayer("satellite");
    $("#lyr-street").onclick = () => setLayer("streets");
    if (store.get("njdm:layer") === "streets") setLayer("streets");
  }

  function pinIcon(p, alert) {
    const cls = ["pin", isPre(p) ? (p.lp_status === "pending" ? "pre" : "closed") : p.is_open ? p.category : isReo(p) ? "reo" : "closed", alert ? "alert" : "", selected === p.property_id ? "selected" : ""].join(" ");
    const n = (p.parcel_group || []).length;
    const flag = (alert ? `<span class="flag">${esc(alertLabel(alert))}</span>` : "") + (n > 1 ? `<span class="multi" title="${n} distress filings on this lot">${n}</span>` : "");
    return L.divIcon({ className: "", html: `<span class="${cls}"><i></i>${flag}</span>`, iconSize: [16, 16], iconAnchor: [8, 8] });
  }

  function drawMarkers() {
    const latest = new Map();
    recentAlerts().forEach((a) => { if (!latest.has(a.property_id)) latest.set(a.property_id, a); });
    markers.forEach((m) => m.remove());
    markers.clear();
    // One pin per tax parcel: when several distress filings sit on the same lot, the pin is the
    // most pressing visible one (open sheriff sale, then pending lis pendens, then bank-owned...).
    const byId = new Map(DATA.properties.map((p) => [p.property_id, p]));
    const shown = new Set();
    DATA.properties.forEach((p) => {
      if (p.lat == null || p.lon == null || !visible(p)) return;
      if (p.parcel_group) {
        const lead = p.parcel_group.map((g) => byId.get(g.property_id)).find((q) => q && q.lat != null && visible(q));
        if (lead && lead.property_id !== p.property_id) return;
        const key = p.parcel_group[0].property_id;
        if (shown.has(key)) return;
        shown.add(key);
      }
      const a = latest.get(p.property_id) || (p.parcel_group || []).map((g) => latest.get(g.property_id)).find(Boolean);
      const m = L.marker([p.lat, p.lon], { icon: pinIcon(p, a), zIndexOffset: a ? 1000 : 0, keyboard: true, title: p.street || "" })
        .on("click", () => select(p.property_id, false))
        .addTo(map);
      m._prop = p; m._alert = a;
      markers.set(p.property_id, m);
    });
  }

  // ---------------------------------------------------------------- sidebar
  function renderStats() {
    const open = DATA.properties.filter((p) => p.is_open);
    const newWeek = recentAlerts().filter((a) => a.kind === "new" || a.kind === "lis_pendens").length;
    const soon = open.filter((p) => { const d = parseDay(p.sale_date); return d && d >= NOW - 864e5 && d <= +NOW + 30 * 864e5; }).length;
    const debt = open.reduce((s, p) => s + (+(p.upset || p.judgment || 0)), 0);
    const reo = DATA.properties.filter(isReo).length;
    const reoSince = DATA.properties.filter(isReo).map((p) => String(p.outcome_date || "").slice(0, 4)).filter(Boolean).sort()[0] || "2020";
    const pre = DATA.properties.filter((p) => isPre(p) && p.lp_status === "pending").length;
    $("#stats").innerHTML = `
      <div class="stat"><b style="color:var(--pin-pre)">${pre}</b><span>Pre-foreclosures</span></div>
      <div class="stat"><b>${open.length}</b><span>On sale lists</span></div>
      <div class="stat"><b style="color:var(--pin-reo)">${reo}</b><span>Bank-owned since ${reoSince}</span></div>
      <div class="stat hot"><b>${newWeek}</b><span>New this week</span></div>
      <div class="stat"><b>${soon}</b><span>Sales in 30 days</span></div>
      <div class="stat"><b>${short$(debt)}</b><span>Upset total</span></div>`;
  }

  function renderFilters() {
    $("#type-chips").innerHTML = TYPES.map((t) =>
      `<button class="chip" data-type="${t.key}" aria-pressed="${state.types.has(t.key)}" style="--c:${t.c}"><i></i>${t.label}</button>`).join("");
    $("#type-chips").querySelectorAll(".chip").forEach((b) => b.onclick = () => {
      const k = b.dataset.type;
      state.types.has(k) ? state.types.delete(k) : state.types.add(k);
      b.setAttribute("aria-pressed", state.types.has(k));
      refresh();
    });
    $("#status-chips").innerHTML = STATUSES.map((t) =>
      `<button class="chip status" data-status="${t.key}" aria-pressed="${state.statuses.has(t.key)}" style="--c:${t.c}"><i></i>${t.label}</button>`).join("");
    $("#status-chips").querySelectorAll(".chip").forEach((b) => b.onclick = () => {
      const k = b.dataset.status;
      state.statuses.has(k) ? state.statuses.delete(k) : state.statuses.add(k);
      b.setAttribute("aria-pressed", state.statuses.has(k));
      refresh();
    });
    const counties = [...new Set(DATA.properties.map((p) => p.county).filter(Boolean))].sort();
    $("#county").insertAdjacentHTML("beforeend", counties.map((c) => `<option>${esc(c)}</option>`).join(""));
    $("#county").onchange = (e) => { state.county = e.target.value; refresh(); };
    $("#window").onchange = (e) => { state.window = +e.target.value || ""; refresh(); };
    let t; $("#q").oninput = (e) => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); refresh(); }, 120); };
    const setTab = (name) => {
      tab = name;
      $("#tab-alerts").setAttribute("aria-selected", name === "alerts");
      $("#tab-reo").setAttribute("aria-selected", name === "reo");
      $("#tab-props").setAttribute("aria-selected", name === "props");
      $("#list").scrollTop = 0;
      renderList();
    };
    $("#tab-alerts").onclick = () => setTab("alerts");
    $("#tab-reo").onclick = () => setTab("reo");
    $("#list").addEventListener("scroll", () => {
      const l = $("#list");
      if (l.scrollTop + l.clientHeight > l.scrollHeight - 400) moreRows();
    });
    $("#tab-props").onclick = () => setTab("props");
    $("#panel-btn").onclick = () => $("#side").classList.toggle("collapsed");
  }

  function placeLine(p) {
    return [p.muni || titleCase(p.city), p.county ? p.county + " Co." : ""].filter(Boolean).join(" · ");
  }

  // Everything but the status chips: the timeline and bank-owned tabs have their own scope.
  function visibleBase(p) {
    const save = state.statuses; state.statuses = { has: () => true };
    try { return visible(p); } finally { state.statuses = save; }
  }

  // A scrolling timeline: new sheriff listings, new lis pendens and every change, newest first.
  function timelineEntries() {
    const byId = new Map(DATA.properties.map((p) => [p.property_id, p]));
    const out = [];
    for (const p of DATA.properties) {
      if (isReo(p) || !visibleBase(p)) continue;
      if (p.stage === "sale_hist") { if (p.outcome_date) out.push({ date: p.outcome_date, kind: "sold_hist", p }); continue; }
      if (isPre(p) && p.recorded) out.push({ date: p.recorded, kind: "lis_pendens", p });
      if (isPre(p) && p.lp_closed_date) out.push({ date: p.lp_closed_date, kind: "lp_closed", p });
      else if (!isPre(p) && p.listed) out.push({ date: p.listed, kind: "listed", est: p.listed_estimated, p });
    }
    for (const a of DATA.alerts) {
      const p = byId.get(a.property_id);
      if (!p || isReo(p) || !visibleBase(p) || a.kind === "new" || a.kind === "lis_pendens" || a.kind === "reo" || a.kind === "lp_closed") continue;
      out.push({ date: String(a.ts).slice(0, 10), kind: a.kind, a, p });
    }
    return out.sort((x, y) => y.date.localeCompare(x.date) || (x.kind === "listed" ? -1 : 1));
  }
  function reoEntries() {
    return DATA.properties.filter((p) => isReo(p) && visibleBase(p))
      .sort((a, b) => String(b.outcome_date || "").localeCompare(String(a.outcome_date || "")));
  }

  const PAGE = 60;
  let ROWS = [], SHOWN = 0, ROWFN = null;
  function moreRows() {
    if (SHOWN >= ROWS.length || !ROWFN) return;
    const list = $("#list");
    const next = ROWS.slice(SHOWN, SHOWN + PAGE);
    list.insertAdjacentHTML("beforeend", next.map((r, i) => ROWFN(r, ROWS[SHOWN + i - 1])).join(""));
    SHOWN += next.length;
    list.querySelectorAll(".item:not([data-wired])").forEach((b) => { b.dataset.wired = "1"; b.onclick = () => select(b.dataset.id, true); });
  }
  const dayHead = (d) => `<div class="day">${esc(new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" }))}</div>`;
  const yearHead = (y) => `<div class="day">${esc(y)}</div>`;

  function timelineRow(e, prev) {
    const p = e.p;
    const head = !prev || prev.date !== e.date ? dayHead(e.date) : "";
    const unseen = LAST_VISIT && e.a && e.a.ts > LAST_VISIT;
    let tag, line;
    if (e.kind === "listed") {
      tag = `<span class="tag" style="--t:var(--alert)">${e.est ? "On sheriff sale list" : "New sheriff sale"}</span>`;
      line = `${e.est ? "First sale date " : "Sale "}${fmtDate(e.est ? e.date : p.sale_date)}${p.upset ? " · Upset " + short$(p.upset) : ""}${p.is_open ? "" : " · " + esc(p.latest_status || "Off the list")}`;
    } else if (e.kind === "sold_hist") {
      tag = `<span class="tag" style="--t:var(--pin-closed)">Sold at sheriff sale</span>`;
      line = `Outside buyer${p.sold_price ? " paid " + short$(p.sold_price) : ""}${p.net_value ? " · Assessed " + short$(p.net_value) : ""} · from state deed records`;
    } else if (e.kind === "lp_closed") {
      tag = `<span class="tag" style="--t:var(--pin-closed)">Lis pendens closed out</span>`;
      line = `${esc(p.lp_closed_label || "Closed out")} · filed ${fmtDate(p.recorded)} by ${esc(titleCase(firstDefendant(p.plaintiff)) || "the lender")}`;
    } else if (e.kind === "lis_pendens") {
      tag = `<span class="tag" style="--t:var(--pin-pre)">Foreclosure filed</span>`;
      line = `Lis pendens by ${esc(titleCase(firstDefendant(p.plaintiff)) || "the lender")}${p.mortgage_amount ? " · Mortgage " + short$(p.mortgage_amount) : ""}`;
    } else {
      const a = e.a;
      const t = a.kind === "closed" ? "var(--pin-closed)" : "var(--pin-possible)";
      tag = `<span class="tag" style="--t:${t}">${esc(alertLabel(a))}</span>`;
      line = esc(alertText(a));
    }
    return `${head}<button class="item" data-id="${p.property_id}" aria-current="${selected === p.property_id}">
          <div class="top">${unseen ? '<span class="unseen" title="New since your last visit"></span>' : ""}${tag}<span class="when">${e.est ? "est." : ""}</span></div>
          <div class="addr">${esc(titleCase(p.street))}</div>
          <div class="meta">${esc(placeLine(p))}${p.class_label ? " · " + esc(p.class_label) : ""}</div>
          <div class="change">${line}</div>
        </button>`;
  }
  function reoRow(p, prev) {
    const y = String(p.outcome_date || "").slice(0, 4);
    const head = !prev || String(prev.outcome_date || "").slice(0, 4) !== y ? yearHead(y || "Date unknown") : "";
    const who = p.plaintiff ? titleCase(firstDefendant(p.plaintiff)) : "Lender (not named in state deed data)";
    return `${head}<button class="item" data-id="${p.property_id}" aria-current="${selected === p.property_id}">
          <div class="top"><span class="addr">${esc(titleCase(p.street))}</span><span class="when">${fmtDate(p.outcome_date)}</span></div>
          <div class="meta">${esc(placeLine(p))} · ${esc(p.class_label || "")}${p.net_value ? " · Assessed " + short$(p.net_value) : ""}</div>
          <div class="change">${esc(who)}${p.resale_date ? ` · <b>sold on ${fmtDate(p.resale_date)} for ${short$(p.resale_price)}</b>` : ""}</div>
        </button>`;
  }

  function renderList() {
    const byId = new Map(DATA.properties.map((p) => [p.property_id, p]));
    const alerts = recentAlerts().filter((a) => byId.has(a.property_id) && visible(byId.get(a.property_id)));
    const order = { pre: 0, open: 1, reo: 2, off: 3 };
    const props = DATA.properties.filter(visible).sort((a, b) => {
      const ka = statusKey(a), kb = statusKey(b);
      if (ka !== kb) return order[ka] - order[kb];
      if (ka === "reo") return String(b.outcome_date || "").localeCompare(String(a.outcome_date || ""));
      if (ka === "pre") return String(b.recorded || "").localeCompare(String(a.recorded || ""));
      return String(a.sale_date || "9").localeCompare(String(b.sale_date || "9"));
    });
    const tl = timelineEntries(), reos = reoEntries();
    $("#n-alerts").textContent = tl.length;
    $("#n-reo").textContent = reos.length;
    $("#n-props").textContent = props.length;
    const list = $("#list");
    if (tab === "alerts" || tab === "reo") {
      ROWS = tab === "alerts" ? tl : reos;
      ROWFN = tab === "alerts" ? timelineRow : reoRow;
      SHOWN = 0;
      list.innerHTML = ROWS.length ? "" : `<div class="empty">${tab === "alerts" ? "Nothing matches these filters." : "No bank-owned properties match these filters."}</div>`;
      moreRows();
      return;
    }
    if (false) {
      list.innerHTML = alerts.length ? alerts.map((a) => {
        const p = byId.get(a.property_id);
        const unseen = LAST_VISIT && a.ts > LAST_VISIT;
        const t = a.kind === "lis_pendens" ? "var(--pin-pre)" : a.kind === "reo" || alertLabel(a) === "Bought back by lender" ? "var(--pin-reo)" : a.kind === "closed" ? "var(--pin-closed)" : a.kind === "new" ? "var(--alert)" : "var(--pin-possible)";
        return `<button class="item" data-id="${p.property_id}" aria-current="${selected === p.property_id}">
          <div class="top">${unseen ? '<span class="unseen" title="New since your last visit"></span>' : ""}<span class="tag" style="--t:${t}">${esc(alertLabel(a))}</span><span class="when">${ago(a.ts)}</span></div>
          <div class="addr">${esc(titleCase(p.street))}</div>
          <div class="meta">${esc(placeLine(p))}${p.class_label ? " · " + esc(p.class_label) : ""}</div>
          <div class="change">${esc(alertText(a))}</div>
        </button>`;
      }).join("") : `<div class="empty">No alerts in the last 7 days for the current filters. New listings, adjournments, sale-date and upset changes, and new bank-owned (REO) properties appear here and pulse on the map.</div>`;
    } else {
      list.innerHTML = props.length ? props.map((p) => `<button class="item" data-id="${p.property_id}" aria-current="${selected === p.property_id}">
          <div class="top"><span class="addr">${esc(titleCase(p.street))}</span><span class="when">${fmtDate(isPre(p) ? p.recorded : isReo(p) ? p.outcome_date : p.sale_date)}</span></div>
          <div class="meta">${isPre(p) ? '<span class="tag" style="--t:var(--pin-pre)">Lis pendens</span> ' : isReo(p) ? '<span class="tag" style="--t:var(--pin-reo)">REO</span> ' : ""}${esc(placeLine(p))} · ${esc(p.class_label || "Needs review")}${p.is_open || isReo(p) || isPre(p) ? "" : " · Off list"}</div>
          <div class="meta">${isPre(p) ? `Mortgage ${short$(p.mortgage_amount)}` : `Upset ${short$(p.upset)}`}${p.net_value ? " · Assessed " + short$(p.net_value) : ""}${p.lat == null ? " · No map location" : ""}</div>
        </button>`).join("") : `<div class="empty">No properties match these filters.</div>`;
    }
    list.querySelectorAll(".item").forEach((b) => b.onclick = () => select(b.dataset.id, true));
  }

  function renderFoot() {
    const r = DATA.last_run;
    if (!r) { $("#foot").textContent = "Waiting for the first scan."; return; }
    const n = Object.keys(r.counties || {}).length;
    const errs = Object.keys(r.county_errors || {});
    const reoErrs = Object.keys(r.reo_errors || {});
    $("#foot").innerHTML = `Last scan ${new Date(r.at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} · ${n} counties` +
      (errs.length ? `<br><span class="err">Could not read: ${esc(errs.join(", "))}</span>` : "") +
      (r.reo_baseline && r.reo_capped ? `<br>Bank-owned (REO) history is still loading; more appear after each daily scan.` : "") +
      (reoErrs.length ? `<br><span class="err">Past sales not read: ${esc(reoErrs.join(", "))}</span>` : "") +
      `<br>Sources: county sheriff listings (CivilView), county clerk records (lis pendens, mortgages), NJ MOD-IV tax data (NJOGIS). Verify before relying on figures.`;
  }

  // ---------------------------------------------------------------- property file
  function copyBtn(text) { return `<button class="copy" data-copy="${esc(text)}" aria-label="Copy ${esc(text)}">Copy</button>`; }

  function renderDetail(p) {
    const hist = (p.status_history || []).slice().reverse();
    const alerts = DATA.alerts.filter((a) => a.property_id === p.property_id).slice(0, 4);
    const debt = +(p.upset || p.judgment || 0);
    const assessed = p.net_value_total || p.net_value;
    const ratio = debt && assessed ? Math.round((100 * debt) / assessed) : null;
    const days = p.sale_date ? Math.round((parseDay(p.sale_date) - NOW) / 864e5) : null;
    const when = days == null ? "" : days > 1 ? ` · in ${days} days` : days === 1 ? " · tomorrow" : days === 0 ? " · today" : "";
    const owner = firstDefendant(p.defendant);
    const others = String(p.defendant || "").slice(owner.length).replace(/^[;,\s]+/, "");
    const lotList = p.lots && p.lots.length > 1 ? `Lots ${p.lots.join(", ")}` : `Lot ${p.lot}`;
    const bl = p.block ? `Block ${p.block} · ${lotList}${p.qual ? " · " + p.qual : ""}` : "";
    const ll = p.lat != null ? `${p.lat},${p.lon}` : encodeURIComponent(`${p.street}, ${p.city}, NJ`);
    const catTag = `<span class="tag" style="--t:${p.category === "land" ? "var(--pin-land)" : "var(--pin)"}">${esc(p.class_label)}${p.prop_class ? " · " + esc(p.prop_class) : ""}</span>`;
    $("#detail").innerHTML = `
      <div class="d-head">
        <button class="x" id="d-close" aria-label="Close">×</button>
        <h2>${esc(titleCase(p.street) || "Address not listed")}</h2>
        <div class="where">${esc(placeLine(p))}${bl ? " · <span class='mono'>" + esc(bl) + "</span>" : ""}</div>
        <div class="tags">${catTag}${isPre(p) ? `<span class="tag" style="--t:var(--pin-pre)">${p.lp_status === "pending" ? "Pre-foreclosure" : esc(p.lp_closed_label || "Lis pendens closed out")}</span>` : p.is_open ? "" : isReo(p) ? '<span class="tag" style="--t:var(--pin-reo)">Bank-owned (REO)</span>' : '<span class="tag" style="--t:var(--pin-closed)">Off the sale list</span>'}</div>
      </div>
      <div class="d-body">
        ${isReo(p) ? (p.stage === "reo_hist"
          ? `<div class="reo-box"><b>Bank-owned since ${fmtDate(p.outcome_date)}</b><div>The foreclosing lender took title by ${esc(p.reo_kind || "sheriff's sale")}${p.reo_price != null && p.reo_kind !== "deed in lieu" ? ` with a ${money(p.reo_price)} bid` : ""}. ${p.resale_date ? `<b style="text-transform:none;letter-spacing:0">The lender sold it on ${fmtDate(p.resale_date)} for ${money(p.resale_price)}.</b>` : "No resale by the lender appears in the state's deed records yet, so it may still be bank-owned."}</div><div class="note">Source: NJ deed records (SR-1A). The state blanks names, so the lender isn't named here; the record history below shows it where the county's records are online.</div></div>`
          : `<div class="reo-box"><b>Bank-owned since ${fmtDate(p.outcome_date)}</b><div>${esc(titleCase(p.plaintiff) || "The foreclosing lender")} took the property back at the sheriff sale${p.outcome_status ? ` (“${esc(p.outcome_status)}”)` : ""}. The lender, its servicer or asset manager now controls the sale.</div></div>`) : ""}
        ${p.stage === "sale_hist" ? `<div class="reo-box"><b>Sold at sheriff sale ${fmtDate(p.outcome_date)}</b><div>An outside bidder bought it at the sheriff's sale${p.sold_price ? ` for ${money(p.sold_price)}` : ""}${p.net_value ? `, against a current assessment of ${money(p.net_value)}` : ""}. The buyer may be a note buyer, investor or developer worth knowing.</div><div class="note">Source: NJ deed records (SR-1A). The state blanks names; the record history below names the buyer where the county's records are online.</div></div>` : ""}
        ${parcelCheck(p)}
        ${stageTracker(p)}
        ${parcelGroup(p)}
        ${alerts.length ? `<div class="alerts-box">${alerts.map((a) => `<div><b>${esc(alertLabel(a))}</b> · ${esc(alertText(a))} <small>${ago(a.ts)}</small></div>`).join("")}</div>` : ""}
        ${isPre(p) ? `<div class="pre-box"><b>${p.lp_status === "pending" ? "Foreclosure filed" : esc(p.lp_closed_label || "Lis pendens closed out")} · lis pendens recorded ${fmtDate(p.recorded)}</b><div>${p.lp_status === "pending"
          ? `${esc(titleCase(firstDefendant(p.plaintiff)) || "The lender")} has started foreclosure${p.complaint_filed ? ` (complaint filed ${fmtDate(p.complaint_filed)})` : ""}. Not yet on a sheriff's sale list${p.recorded && (NOW - parseDay(p.recorded)) > 365 * 864e5 ? `: still open ${Math.floor((NOW - parseDay(p.recorded)) / (365.25 * 864e5))}+ years after filing` : ""}.`
          : `Closed out ${p.lp_closed_date ? fmtDate(p.lp_closed_date) : ""}: ${esc((p.lp_closed_label || "").toLowerCase())}. The foreclosure by ${esc(titleCase(firstDefendant(p.plaintiff)) || "the lender")} is no longer open.`}</div></div>` : ""}
        <div class="figs">
          ${isPre(p) ? `<div class="fig"><span>Mortgage</span><b>${short$(p.mortgage_amount)}</b></div><div class="fig"><span>Mortgage date</span><b>${p.mortgage_date ? fmtDate(p.mortgage_date) : "—"}</b></div>` : `<div class="fig"><span>Upset</span><b>${short$(p.upset)}</b></div>`}
          ${isPre(p) ? "" : `<div class="fig"><span>Judgment</span><b>${short$(p.judgment)}</b></div>`}
          <div class="fig"><span>${p.net_value_total ? `Assessed · ${p.lots.length} lots` : "Assessed"}</span><b>${short$(assessed)}</b></div>
        </div>
        ${ratio != null ? `<div class="meter"><div>Debt is <b>${ratio}%</b> of assessed value</div><div class="bar"><i style="width:${Math.min(ratio, 100)}%;--fill:${ratio >= 90 ? "var(--alert)" : ratio >= 70 ? "var(--pin-possible)" : "var(--ok)"}"></i></div></div>` : ""}
        ${isPre(p) ? `<div class="sec"><h3>Foreclosure filing</h3><dl class="kv">
          <dt>Lis pendens</dt><dd>${fmtDate(p.recorded)} · <span class="mono">Inst. ${esc(p.instrument)}</span>${copyBtn(p.instrument)}</dd>
          ${p.docket ? `<dt>Docket</dt><dd class="mono">${esc(p.docket)}</dd>` : ""}
          ${p.complaint_filed ? `<dt>Complaint filed</dt><dd>${fmtDate(p.complaint_filed)}</dd>` : ""}
          ${p.mortgage_ref ? `<dt>Mortgage</dt><dd>${short$(p.mortgage_amount)}${p.mortgage_date ? " · " + fmtDate(p.mortgage_date) : ""}<div class="note">${esc(p.mortgage_ref)}</div></dd>` : ""}
          ${p.attorney_firm || p.attorney ? `<dt>Lender's attorney</dt><dd><b>${esc(p.attorney || "")}</b>${p.attorney_firm ? `<div>${esc(titleCase(p.attorney_firm))}</div>` : ""}${p.attorney_phone ? `<div class="mono">${esc(p.attorney_phone)}${copyBtn(p.attorney_phone)}</div>` : ""}${p.attorney_email ? `<div class="mono">${esc(p.attorney_email)}${copyBtn(p.attorney_email)}</div>` : ""}</dd>` : ""}
        </dl></div>` : ""}
        <div class="sec"${isPre(p) ? " hidden" : ""}><h3>Sheriff sale</h3><dl class="kv">
          <dt>Sale date</dt><dd>${fmtDate(isReo(p) ? p.outcome_date || p.sale_date : p.sale_date)}${isReo(p) ? "" : when}</dd>
          <dt>Status</dt><dd>${esc(p.latest_status || "—")}</dd>
          <dt>Docket</dt><dd><span class="mono">${esc(p.court_case || "—")}</span>${p.court_case ? copyBtn(p.court_case) : ""}</dd>
          <dt>Sheriff #</dt><dd class="mono">${esc(p.sheriff_number || "—")}</dd>
        </dl></div>
        <div class="sec"><h3>Parties</h3><dl class="kv">
          ${isReo(p) ? `<dt>Owner now</dt><dd><b>${esc(titleCase(p.plaintiff) || "—")}</b><div class="note">Foreclosing lender (bought back at sale)</div></dd>
          <dt>Former owner</dt><dd>${esc(titleCase(owner) || "—")}${others ? `<div class="note">Also named: ${esc(titleCase(others))}</div>` : ""}</dd>` :
          `<dt>Owner</dt><dd><b>${esc(titleCase(owner) || "—")}</b>${others ? `<div class="note">Also named: ${esc(titleCase(others))}</div>` : ""}</dd>
          <dt>Lender</dt><dd>${esc(titleCase(p.plaintiff) || "—")}</dd>`}
          <dt>Attorney</dt><dd>${esc(titleCase(p.attorney) || "—")}${p.attorney_phone ? `<div class="mono">${esc(p.attorney_phone)}${copyBtn(p.attorney_phone)}</div>` : ""}</dd>
        </dl></div>
        <div class="sec enrich" id="enrich-sec">
          <h3>Owner &amp; lender contacts</h3>
          <button class="enrich-btn" id="enrich-btn" type="button">Enrich contact info</button>
          <p class="note">Reads the county's recorded mortgages and filings for the people behind the owner and the loan.</p>
        </div>
        <div class="sec"><h3>Tax record</h3>${p.prop_class ? `<dl class="kv">
          <dt>Class</dt><dd>${esc(p.prop_class)} · ${esc(p.class_label)}</dd>
          ${p.bldg_desc ? `<dt>Building</dt><dd class="mono">${esc(p.bldg_desc)}</dd>` : ""}
          ${p.calc_acre ? `<dt>Lot size</dt><dd>${(+p.calc_acre).toFixed(2)} acres</dd>` : ""}
          ${p.yr_constr ? `<dt>Year built</dt><dd>${esc(p.yr_constr)}</dd>` : ""}
          ${p.last_sale_price ? `<dt>Last sale</dt><dd>${money(p.last_sale_price)} · ${fmtDate(p.last_sale_date)}</dd>` : ""}
          ${p.last_yr_tax ? `<dt>Annual taxes</dt><dd>${money(p.last_yr_tax)}</dd>` : ""}
        </dl>` : `<p class="note">${esc(p.category_reason || "Not matched to a tax record.")}</p>`}</div>
        <div class="sec" id="records-sec"><h3>Public record history</h3><p class="note">Loading…</p></div>
        <div class="sec"><h3>Status history</h3><ol class="timeline">${hist.map((h) => `<li><span>${esc(h[0])}</span><time>${fmtDate(h[1])}</time></li>`).join("") || "<li>None posted</li>"}</ol></div>
        ${p.description ? `<details><summary>Legal description</summary><p>${esc(p.description)}</p></details>` : ""}
        <div class="links">
          ${p.detail_url ? `<a href="${esc(p.detail_url)}" target="_blank" rel="noopener">${isPre(p) ? "County clerk records" : "Sheriff listing"}</a>` : ""}
          <a href="https://www.google.com/maps/search/?api=1&query=${ll}" target="_blank" rel="noopener">Google Maps</a>
          ${p.lat != null ? `<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${p.lat},${p.lon}" target="_blank" rel="noopener">Street View</a>` : ""}
        </div>
        ${p.lat == null ? `<p class="note">No map location yet: the address couldn't be matched to a parcel or geocoded.</p>` : ""}
      </div>`;
    $("#d-close").onclick = closeDetail;
    $("#enrich-btn").onclick = () => showContacts(p);
    showRecords(p);
    document.querySelectorAll("#detail [data-goto]").forEach((b) => b.addEventListener("click", () => select(b.dataset.goto, false)));
    $("#detail").querySelectorAll("[data-copy]").forEach((b) => b.onclick = () => {
      const txt = b.dataset.copy;
      Promise.resolve().then(() => navigator.clipboard.writeText(txt)).then(() => { b.textContent = "Copied"; }, () => {
        const r = document.createRange(); r.selectNodeContents(b.previousElementSibling || b); getSelection().removeAllRanges(); getSelection().addRange(r);
      });
    });
  }

  // ---- Foreclosure stage --------------------------------------------------
  // Where the property is in the foreclosure process, from the filing to the outcome.
  function stageTracker(p) {
    const hist = p.status_history || [];
    const adj = hist.filter((h) => /adjourn/i.test(h[0])).length;
    const bk = hist.some((h) => /bankrupt/i.test(h[0]));
    const lp = isPre(p) ? p.recorded : (p.lp_recorded || null);
    const outcome = isReo(p) ? `Bank-owned (REO)` : p.is_open ? null :
      isPre(p) ? (p.lp_status && p.lp_status !== "pending" ? (p.lp_closed_label || "Closed out") : null) :
      /sold|purchas/i.test(p.latest_status || "") ? "Sold at sheriff sale" : /cancel|withdr|vacat|dismiss/i.test(p.latest_status || "") ? "Cancelled / withdrawn" : "Off the sale list";
    const steps = [
      { label: "Foreclosure filed", sub: lp ? `Lis pendens ${fmtDate(lp)}` : (isPre(p) ? "" : "Before sheriff list"), done: !!lp || !isPre(p) },
      { label: "Sheriff sale list", sub: isPre(p) ? "Not yet" : p.listed ? `${p.listed_estimated ? "By " : ""}${fmtDate(p.listed)}` : "", done: !isPre(p) },
      { label: "Sale date", sub: isPre(p) ? "" : p.sale_date ? `${fmtDate(isReo(p) ? p.outcome_date : p.sale_date)}${adj ? ` · ${adj} adjournment${adj > 1 ? "s" : ""}` : ""}${bk ? " · bankruptcy" : ""}` : "", done: !isPre(p) && !!(p.sale_date || isReo(p)) },
      { label: "Outcome", sub: outcome || "Pending", done: !!outcome },
    ];
    const cur = steps.findIndex((x) => !x.done);
    return `<ol class="stages">${steps.map((x, i) => `<li class="${x.done ? "done" : ""}${i === (cur === -1 ? steps.length - 1 : cur) ? " now" : ""}"><b>${esc(x.label)}</b><span>${esc(x.sub || "")}</span></li>`).join("")}</ol>`;
  }

  // ---- Public record history ------------------------------------------------
  let RECORDS = null;
  async function loadRecords() {
    if (RECORDS) return RECORDS;
    if (DATA.sample) return (RECORDS = {});
    try { RECORDS = await (await fetch("data/records.json", { cache: "no-cache" })).json(); } catch { RECORDS = {}; }
    return RECORDS;
  }
  const RECORD_COUNTIES = ["Essex", "Passaic", "Burlington", "Monmouth"];
  const kindColor = (k) => /lis pendens|foreclos|sheriff/i.test(k) ? "var(--alert)" : /mortgage|assignment/i.test(k) ? "var(--pin)" :
    /deed/i.test(k) ? "var(--ok)" : /settlement/i.test(k) ? "var(--pin-pre)" : /tax|lien|judgment/i.test(k) ? "var(--pin-reo)" : "var(--ink-3)";
  async function showRecords(p) {
    const sec = $("#records-sec");
    if (!sec) return;
    const all = await loadRecords();
    if (selected !== p.property_id) return;
    const r = all[p.property_id] || {};
    const f = r.filings || [];
    const deeds = r.state_deeds || [];
    const row = (x) => `<li><span class="rk" style="--t:${kindColor(x.kind)}">${esc(x.kind)}</span><time>${fmtDate(x.recorded)}</time>
        <div class="rp">${esc((x.from || []).slice(0, 2).map(titleCase).join("; ") || "—")} <span class="arrow">→</span> ${esc((x.to || []).slice(0, 2).map(titleCase).join("; ") || "—")}</div>
        <div class="note mono">Inst. ${esc(x.instrument)}${x.block ? ` · Block ${esc(x.block)}${x.lot ? " Lot " + esc(x.lot) : ""}` : ""}</div></li>`;
    const deedColor = (k) => /Lender|lieu/i.test(k) ? "var(--pin-reo)" : /Sheriff/i.test(k) ? "var(--alert)" : "var(--ink-3)";
    const drow = (d) => `<li><span class="rk" style="--t:${deedColor(d.kind)}">${esc(d.kind)}</span><time>${fmtDate(d.date)}</time>
        <div class="rp">${d.price ? money(d.price) : "No price"}${d.location ? " · " + esc(titleCase(d.location)) : ""}</div></li>`;
    const county = f.length ? `<h3>Public record history <span class="count">${f.length}</span></h3>
      <ol class="records">${f.slice(0, 12).map(row).join("")}</ol>
      ${f.length > 12 ? `<details><summary>Show all ${f.length}</summary><ol class="records">${f.slice(12).map(row).join("")}</ol></details>` : ""}
      <p class="note">From the ${esc(p.county)} County clerk's index (deeds, mortgages, assignments, easements, liens, lis pendens and more) · read ${ago(r.generated_at)}.</p>`
      : `<h3>Public record history</h3><p class="note">${RECORD_COUNTIES.includes(p.county)
        ? "The county's recorded documents (mortgages, assignments, lis pendens) haven't been read for this property yet; they're read a few each night."
        : `${esc(p.county || "This")} County's recorded documents aren't connected yet (see the coverage checklist).`}</p>`;
    const state = deeds.length ? `<h4 class="subh">Deeds since 2020 <span class="count">${deeds.length}</span></h4>
      <ol class="records">${deeds.slice(0, 8).map(drow).join("")}</ol>
      ${deeds.length > 8 ? `<details><summary>Show all ${deeds.length}</summary><ol class="records">${deeds.slice(8).map(drow).join("")}</ol></details>` : ""}
      <p class="note">From the state's deed records, every county. Buyer and seller names are withheld from this data by law.</p>` : "";
    sec.innerHTML = county + state;
  }


  // ---- Contact enrichment -------------------------------------------------
  // canEnrich() is the single gate for this feature: swap it for a real entitlement check
  // (signed-in, paid account) when contacts move behind a paywall. On GitHub Pages the data
  // file itself is public, so a real paywall also means serving contacts.json from a backend.
  const canEnrich = () => true;
  let CONTACTS = null;
  async function loadContacts() {
    if (CONTACTS) return CONTACTS;
    if (DATA.sample) return (CONTACTS = {});
    try { CONTACTS = await (await fetch("data/contacts.json", { cache: "no-cache" })).json(); } catch { CONTACTS = {}; }
    return CONTACTS;
  }
  const PRESS_COUNTIES = { Essex: "https://press.essexregister.com/prodpress/clerk/ClerkHome.aspx?op=basic", Passaic: "https://records.passaiccountynj.org/press/clerk/ClerkHome.aspx?op=basic" };
  async function showContacts(p) {
    const sec = $("#enrich-sec");
    if (!sec) return;
    if (!canEnrich()) { sec.innerHTML = `<h3>Owner &amp; lender contacts</h3><p class="note">Contact enrichment is available on paid plans.</p>`; return; }
    sec.innerHTML = `<h3>Owner &amp; lender contacts</h3><p class="note">Loading…</p>`;
    const all = await loadContacts();
    if (selected !== p.property_id) return;
    const c = all[p.property_id];
    if (!c) {
      sec.innerHTML = `<h3>Owner &amp; lender contacts</h3><p class="note">Not enriched yet. Properties are researched overnight, largest first; check back after the next daily update.</p>`;
      return;
    }
    const o = c.owner || {}, l = c.lender || {}, loan = l.loan || {};
    const person = (x) => `<li><b>${esc(x.name)}</b>${x.title ? `, ${esc(x.title)}` : ""}${x.entity ? ` <span class="note">of ${esc(titleCase(x.entity))}</span>` : ""}${x.seen_on ? `<div class="note">Named on ${esc(x.seen_on.slice(0, 3).join("; "))}</div>` : ""}</li>`;
    const people = [...(o.signers || []).map((s) => ({ ...s, src: "signed" }))];
    for (const x of o.people || []) if (!people.some((y) => y.name.toLowerCase() === x.name.toLowerCase())) people.push(x);
    const filings = (o.filings || []).slice(0, 8);
    const records = PRESS_COUNTIES[c.county];
    sec.innerHTML = `
      <h3>Owner &amp; lender contacts</h3>
      ${(c.notes || []).map((n) => `<div class="enrich-note">${esc(n)}</div>`).join("")}
      <h4>Owner side</h4>
      ${people.length ? `<ul class="people">${people.map(person).join("")}</ul>` : `<p class="note">${c.source ? "No individuals named on the owner's recorded filings." : "No recorded-document search for this county yet."}</p>`}
      ${o.related_entities && o.related_entities.length ? `<p class="note">Related companies named in the case: ${esc(o.related_entities.map(titleCase).join(", "))}</p>` : ""}
      <h4>Lender side</h4>
      <dl class="kv">
        <dt>Lender type</dt><dd>${esc(l.kind || "—")}</dd>
        ${loan.lender ? `<dt>Loan</dt><dd>${esc(titleCase(loan.lender))}${loan.amount ? ` · <b>${money(loan.amount)}</b>` : ""}${loan.date ? ` · ${fmtDate(loan.date)}` : ""}</dd>` : ""}
        ${loan.prepared_by ? `<dt>Prepared by</dt><dd><b>${esc(loan.prepared_by)}</b><div class="note">Usually the loan officer or lending team; sometimes the lender's attorney</div></dd>` : ""}
        ${loan.notice_address && loan.notice_address.length ? `<dt>Lender address</dt><dd>${loan.notice_address.map(esc).join("<br>")}</dd>` : ""}
        ${l.servicer ? `<dt>${esc(l.servicer.role)}</dt><dd><b>${esc(l.servicer.name)}</b><div class="note">Handles the loan for the trust: the decision-maker on a sale</div></dd>` : ""}
        ${l.trustee ? `<dt>Trustee</dt><dd>${esc(l.trustee)}</dd>` : ""}
        ${l.bank ? `<dt>Bank HQ</dt><dd>${esc(titleCase(l.bank.name))}<div>${esc(titleCase(l.bank.hq))}</div>${l.bank.website ? `<a href="${/^https?:/.test(l.bank.website) ? esc(l.bank.website) : "https://" + esc(l.bank.website)}" target="_blank" rel="noopener">${esc(l.bank.website)}</a>` : ""}</dd>` : ""}
        ${l.foreclosure_counsel ? `<dt>Foreclosure counsel</dt><dd>${esc(titleCase(l.foreclosure_counsel.name))}${l.foreclosure_counsel.phone ? `<div class="mono">${esc(l.foreclosure_counsel.phone)}</div>` : ""}</dd>` : ""}
      </dl>
      ${filings.length ? `<details><summary>Recorded filings (${(o.filings || []).length})</summary><table class="filings"><tbody>${filings.map((f) => `<tr><td>${fmtDate(f.recorded)}</td><td>${esc(f.kind)}${f.to && f.to.length ? `<div class="note">${esc((f.type.match(/^DEED/) ? "to " : "→ ") + f.to.map(titleCase).join(", "))}</div>` : ""}</td><td class="mono">${esc(f.instrument)}</td></tr>`).join("")}</tbody></table></details>` : ""}
      <p class="note">From public records${records ? ` (<a href="${records}" target="_blank" rel="noopener">${esc(c.county)} County clerk</a>, search by instrument #)` : ""} · researched ${ago(c.generated_at)}. Verify before outreach.</p>`;
  }

  function select(id, fly) {
    const p = DATA.properties.find((x) => x.property_id === id);
    if (!p) return;
    const prev = selected;
    selected = id;
    [prev, id].forEach((pid) => { const m = markers.get(pid); if (m) m.setIcon(pinIcon(m._prop, m._alert)); });
    renderDetail(p);
    $("#detail").hidden = false;
    if (window.matchMedia("(max-width: 760px)").matches) $("#side").classList.add("collapsed");
    renderList();
    if (outline) { outline.remove(); outline = null; }
    if (p.lat != null) {
      const go = () => {
        const z = Math.max(map.getZoom(), 17);
        const pt = map.project([p.lat, p.lon], z);
        const offset = window.matchMedia("(max-width: 760px)").matches ? L.point(0, map.getSize().y * 0.25) : L.point(190, 0);
        const target = map.unproject(pt.add(offset), z);
        fly ? map.flyTo(target, z, { duration: 1.2 }) : map.setView(target, z);
      };
      go();
      drawParcel(p);
    }
  }

  function parcelCheck(p) {
    const c = p.parcel_check;
    if (!c || c === "verified") return c ? `<p class="pcheck ok">✓ ${esc(p.parcel_check_note || "Lot matches the filing.")}</p>` : "";
    if (c === "address") return `<p class="pcheck addr">${esc(p.parcel_check_note)}</p>`;
    if (c === "mismatch") return `<p class="pcheck bad">⚠ ${esc(p.parcel_check_note)}</p>`;
    return `<p class="pcheck bad">${esc(p.parcel_check_note || "No tax parcel found.")}</p>`;
  }
  function parcelGroup(p) {
    const g = p.parcel_group;
    if (!g || g.length < 2) return "";
    const kindColor = { sheriff: "var(--alert)", lis_pendens: "var(--pin-pre)", reo: "var(--pin-reo)", sold: "var(--pin-closed)", sheriff_closed: "var(--pin-closed)" };
    const row = (x) => `<li><button class="gitem" data-goto="${esc(x.property_id)}" aria-current="${x.property_id === p.property_id}">
        <span class="rk" style="--t:${kindColor[x.kind] || "var(--muted)"}">${esc(x.label)}</span><time>${fmtDate(x.date)}</time>
        <div class="rp">${esc(x.lender ? titleCase(firstDefendant(x.lender)) : "")}${x.amount ? " · " + short$(x.amount) : ""}${x.docket ? " · " + esc(x.docket) : x.instrument ? " · Inst. " + esc(x.instrument) : ""}</div></button></li>`;
    return `<section class="sec"><h3>Distress on this lot <span class="count">${g.length}</span></h3>
      <p class="note">Every sheriff sale, lis pendens and bank take-back recorded against this block and lot. Each can be a different loan or lender.</p>
      <ol class="records">${g.map(row).join("")}</ol></section>`;
  }

  async function drawParcel(p) {
    if (!p.pams_pin || DATA.sample) return;
    // Only outline a lot the filing itself names (or, with no block/lot in the filing, the address match).
    if (p.parcel_check && !["verified", "address"].includes(p.parcel_check)) { if (outline) { outline.remove(); outline = null; } return; }
    const want = p.property_id;
    try {
      // Every lot the sheriff's notice covers, not just the main one.
      const pins = (p.parcel_pins && p.parcel_pins.length ? p.parcel_pins : [p.pams_pin]).map((x) => `'${String(x).replace(/'/g, "''")}'`);
      const url = PARCELS + "?" + new URLSearchParams({ where: `PAMS_PIN IN (${pins.join(",")})`, outFields: "PAMS_PIN,PCLBLOCK,PCLLOT", returnGeometry: "true", outSR: "4326", f: "geojson" });
      const gj = await (await fetch(url)).json();
      if (selected !== want || !gj.features?.length) return;
      if (outline) outline.remove();
      outline = L.geoJSON(gj, {
        style: { color: "#ffe066", weight: 2.5, fillColor: "#ffe066", fillOpacity: 0.12, dashArray: "6 4" },
        interactive: false,
        onEachFeature: (f, layer) => {
          const pr = f.properties || {};
          if (pr.PCLLOT) layer.bindTooltip(`Block ${pr.PCLBLOCK} · Lot ${pr.PCLLOT}`, { permanent: gj.features.length <= 8, direction: "center", className: "lot-label" });
        },
      }).addTo(map);
      if (gj.features.length > 1) {
        const pad = window.matchMedia("(max-width: 760px)").matches ? [20, 20] : [40, 40];
        map.fitBounds(outline.getBounds(), { paddingTopLeft: pad, paddingBottomRight: window.matchMedia("(max-width: 760px)").matches ? [20, map.getSize().y * 0.5] : [420, 40], maxZoom: 19 });
      }
    } catch { /* outline is a nice-to-have */ }
  }

  function closeDetail() {
    const prev = selected;
    selected = null;
    $("#detail").hidden = true;
    if (outline) { outline.remove(); outline = null; }
    const m = markers.get(prev); if (m) m.setIcon(pinIcon(m._prop, m._alert));
    renderList();
  }

  function refresh() { drawMarkers(); renderList(); }

  function toast(msg) {
    const t = document.createElement("div");
    t.className = "toast"; t.innerHTML = msg;
    $(".body").appendChild(t);
    setTimeout(() => t.remove(), 6000);
  }

  async function load() {
    try {
      const r = await fetch("data/map.json", { cache: "no-store" });
      if (!r.ok) throw new Error(r.status);
      return await r.json();
    } catch {
      const d = JSON.parse(document.getElementById("sample-data").textContent);
      d.sample = true;
      return d;
    }
  }

  async function start() {
    DATA = await load();
    NOW = new Date(DATA.generated_at || Date.now());
    DATA.alerts.sort((a, b) => (b.ts > a.ts ? 1 : b.ts < a.ts ? -1 : b.id - a.id));
    LAST_VISIT = DATA.sample ? null : store.get("njdm:lastVisit");
    initMap();
    renderStats(); renderFilters(); renderFoot(); refresh();
    const pts = DATA.properties.filter((p) => p.is_open && p.lat != null).map((p) => [p.lat, p.lon]);
    if (pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 13 });
    if (DATA.sample) {
      $(".body").insertAdjacentHTML("beforeend", `<div class="sample-banner"><b>Sample data</b>The live map fills in after the first daily scan.</div>`);
    } else {
      const fresh = LAST_VISIT ? DATA.alerts.filter((a) => a.ts > LAST_VISIT).length : 0;
      if (fresh) toast(`<b>${fresh} alert${fresh === 1 ? "" : "s"}</b> since your last visit`);
      store.set("njdm:lastVisit", DATA.generated_at);
    }
    if (window.matchMedia("(max-width: 760px)").matches) $("#side").classList.add("collapsed");
  }
  start();
})();
</script>

</body>
</html>
