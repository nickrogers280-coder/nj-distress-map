# NJ Distressed Property Tracker settings

# CivilView county IDs to scan. "all" = every NJ county on CivilView except Ocean (stale).
#   1 Camden   2 Essex   3 Burlington  6 Cumberland  7 Bergen   8 Monmouth  9 Morris
#  10 Hudson  15 Union  17 Passaic    19 Gloucester 20 Salem   25 Atlantic 32 Hunterdon
#  52 Cape May  73 Middlesex  85 Ocean (not updated since Feb 2026)
counties: all

# NJ MOD-IV property classes that count as targets:
#   1 vacant land, 4A commercial, 4B industrial, 4C apartments (5+ units)
target_classes: ["1", "4A", "4B", "4C"]

# Skip target properties assessed below this (0 = no minimum).
min_assessed_value: 0

# Flag listings that can't be matched to a tax record but whose owner is an LLC/corp.
include_possible: true
possible_min_amount: 0        # minimum judgment or upset price for those

# How often to re-read the detail page of tracked properties to catch status changes.
refresh_tracked_details_hours: 20

# Pause between requests to the sheriff sale site (be polite).
request_delay_seconds: 1.0

# Included in the scraper's User-Agent so site operators can reach you. Can also be set
# with the CONTACT_EMAIL environment variable / GitHub secret instead of here.
contact_email: ""

# The map website is the main view. Email digests are optional.
email:
  enabled: false              # true = also email a daily digest (needs the SMTP_* secrets)
  subject_prefix: "NJ Distress Alert"
  send_when_no_news: false    # true = get an email every run even with nothing new
